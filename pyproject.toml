[project]
name = "zeta0-humanoid"
version = "0.1.1"
description = "Zeta0: humanoid demonstration capture, policy training and deployment"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/Apache-2.0.txt", "LICENSES/GEAR-SONIC.txt", "THIRD_PARTY_NOTICES.md"]
requires-python = "==3.10.*"
dependencies = [
    # Dependency floors also apply to non-uv installations.
    "filelock>=3.20.3",
    "aiohttp>=3.14.3",
    "click>=8.3.3",
    "gitpython>=3.1.59",
    "idna>=3.15",
    "msgpack>=1.2.1",
    "pillow>=12.3.0",
    "pygments>=2.20.0",
    "requests>=2.33.0",
    "urllib3>=2.7.0",
    "datasets==3.6.0",
    "einops==0.8.1",
    "imageio==2.34.2",
    "numpy<2.0.0",
    "opencv-python",
    "pydantic==2.10.6",
    "tqdm==4.67.1",
    "typer>=0.19.1",
    "tyro==0.9.32",
    "wandb>=0.20.0",
    "python-dotenv>=1.2.2",
]

[project.urls]
Repository = "https://github.com/chenyizhi123/Zeta0"
Issues = "https://github.com/chenyizhi123/Zeta0/issues"

[project.scripts]
zeta = "psi.cli:main"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
psi = ["assets/*"]

[tool.setuptools.packages.find]
where = ["src"]
# Only the maintained Zeta-0 implementation belongs in the wheel.
include = ["psi", "psi.*"]

[tool.uv.sources]
zeta0-humanoid = { path = ".", editable = true }

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
gr00t = [
    # The pinned source action head is used inside Zeta's trainer, not the
    # upstream trainer's separate Python/CUDA environment.
    "diffusers==0.35.1",
    "dm-tree==0.1.9",
    "albumentations==1.4.18",
    "opencv-python-headless<4.12",
    "msgpack-numpy==0.4.8",
    "lmdb==1.7.5",
    "omegaconf==2.3.0",
    "termcolor==3.2.0",
]
data-bootstrap = [
    "pip==26.2.1",
]
cpu-test = [
    "pytest==9.0.3",
    "httpx==0.28.1",
    "ruff==0.14.7",
    "numpy==1.26.4",
    "pillow==12.3.0",
    "safetensors==0.6.2",
    "tomli>=2.2.1; python_version < '3.11'",
    "torch==2.7.0",
]
serve = [
    "fastapi",
    "uvicorn",
    "pyzmq==27.2.0",
]

robot = [
    "pyzmq==27.2.0",
    "msgpack-numpy==0.4.8",
]

psi = [
    "setuptools>=83.0.0",
    "torch==2.7.0",
    "torchvision==0.22.0",
    "torchcodec==0.4.0",
    "transformers==4.57.3",
    "triton==3.3.0",
    "accelerate==1.7.0",
    "sentencepiece",
    "lerobot @ git+https://github.com/songlin/lerobot.git@09929d8057b044b53aecaf5c6d7eb71f99e8beb9"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py310"
extend-exclude = ["third_party", "paper", "diagnostics", "chenyz", "posttrain_runs", "eval_runs"]

[tool.ruff.lint]
# Start with correctness checks, not a repository-wide formatting rewrite.
select = ["E9", "F63", "F7", "F82", "F811", "E722", "F601"]
